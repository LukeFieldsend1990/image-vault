name = "image-vault-pipeline-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Large scan packages (20GB+) need the max CPU time limit
[limits]
cpu_ms = 300000

# -------------------------------------------------------------------
# Queue consumer
# -------------------------------------------------------------------
[[queues.consumers]]
queue = "pipeline-jobs"
max_batch_size = 1        # process one job at a time (jobs are heavy)
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "pipeline-jobs-dlq"

# -------------------------------------------------------------------
# D1 Database (shared with main app)
# -------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "image-vault-db"
database_id = "71665618-0498-48bd-a243-962eb4810769"

# -------------------------------------------------------------------
# R2 Buckets
# -------------------------------------------------------------------
[[r2_buckets]]
binding = "SCANS_BUCKET"
bucket_name = "image-vault-scans"
preview_bucket_name = "image-vault-scans-dev"

[[r2_buckets]]
binding = "PIPELINE_BUCKET"
bucket_name = "image-vault-pipeline"
preview_bucket_name = "image-vault-pipeline-dev"

# -------------------------------------------------------------------
# Workers AI binding
# -------------------------------------------------------------------
[ai]
binding = "AI"

# -------------------------------------------------------------------
# Browser Rendering (derived-stills turntable renders — Workers Paid).
# Optional: without this binding the derived-stills job records 'skipped'
# and everything else runs unchanged. Uncomment to enable.
# -------------------------------------------------------------------
# [browser]
# binding = "BROWSER"

# -------------------------------------------------------------------
# Queue producer — the probe executor re-enqueues its own next batch
# (resumable probe_batch jobs). Same queue it consumes from.
# -------------------------------------------------------------------
[[queues.producers]]
binding = "PIPELINE_QUEUE"
queue = "pipeline-jobs"

# -------------------------------------------------------------------
# Service bindings (worker-to-worker, zero-latency)
# -------------------------------------------------------------------
[[services]]
binding = "AI_SERVICE"
service = "image-vault-ai"

# -------------------------------------------------------------------
# Environment Variables
# -------------------------------------------------------------------
[vars]
RESEND_FROM_EMAIL = "ImageVault <noreply@imagevault.ai>"
APP_URL = "https://imagevault.ai"

# -------------------------------------------------------------------
# Secrets (set via: wrangler secret put SECRET_NAME --config pipeline-worker/wrangler.toml)
# -------------------------------------------------------------------
# RESEND_API_KEY  - Email notifications
# MESHY_API_KEY   - GLB preview generation (optional; stage skipped if absent)
#
# Derived-stills job (optional; job records 'skipped' when absent):
# CF_ACCOUNT_ID          - account for R2 S3-API presigning
# R2_ACCESS_KEY_ID       - R2 API token key (presigns the render source for
# R2_SECRET_ACCESS_KEY     the Browser Rendering page)
# R2_BUCKET_NAME         - defaults to image-vault-scans
# NOTE: the scans bucket also needs a CORS rule allowing GET from APP_URL,
# or the render page's cross-origin OBJ/video fetch fails.
#
# Model Probe Protocol (optional; probe_batch jobs only):
# REPLICATE_API_TOKEN          - image generation API
# REPLICATE_MODEL_VERSION      - base model version id (hosted_model targets)
# REPLICATE_LORA_MODEL_VERSION - a LoRA-runner version that accepts a `lora` url
#                                (civitai_lora targets); falls back to the base
# REPLICATE_PER_IMAGE_USD      - nominal per-image cost for spend recording
# AWS_ACCESS_KEY_ID            - Rekognition CompareFaces (identity scoring);
# AWS_SECRET_ACCESS_KEY          absent → identity channel skipped, pHash only
# AWS_REGION                   - defaults to us-east-1
