name = "image-vault"
# Custom entrypoint: wraps the OpenNext-generated .open-next/worker.js and adds
# the monitor-sweeps queue consumer (durable likeness sweeps). See worker.ts.
main = "worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Likeness sweeps consume the monitor-sweeps queue in this Worker; a sweep is
# I/O-bound (Apify polling) but can accumulate CPU across a 10-minute run.
# Ceiling only — billing is on actual usage. Matches pipeline-worker.
[limits]
cpu_ms = 300000

# Persistent Workers Logs. Likeness sweeps run as background work whose
# console.warn diagnostics — and whose isolate-kill outcomes (exceededCpu,
# OOM, eviction) — were previously observable only through a live `wrangler
# tail`. Silent sweep deaths (2026-08-17) motivated turning this on.
[observability]
enabled = true

# Static assets emitted by the OpenNext build (replaces Pages' pages_build_output_dir).
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# -------------------------------------------------------------------
# R2 Buckets
# -------------------------------------------------------------------
[[r2_buckets]]
binding = "SCANS_BUCKET"
bucket_name = "image-vault-scans"
preview_bucket_name = "image-vault-scans-dev"

[[r2_buckets]]
binding = "PIPELINE_BUCKET"
bucket_name = "image-vault-pipeline"
preview_bucket_name = "image-vault-pipeline-dev"

# -------------------------------------------------------------------
# D1 Database
# -------------------------------------------------------------------
# `remote = true` makes `next dev` (and `wrangler dev`) hit the production
# database instead of the miniflare-local one. Chosen deliberately while we
# are pre-launch: the 4 TMDB-linked talents are test accounts, and running
# scans against them against a real identity anchor is the point of the test.
# When we ship, either flip this back to false or gate it on ENVIRONMENT.
[[d1_databases]]
binding = "DB"
database_name = "image-vault-db"
database_id = "71665618-0498-48bd-a243-962eb4810769"
migrations_dir = "drizzle/migrations"
remote = true

# -------------------------------------------------------------------
# KV Namespaces (sessions, download tokens)
# -------------------------------------------------------------------
[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "3d37f156b49348cdad79e28e8812b7e3"
preview_id = "3570e35d13f245c294ab8b0ef2d6a680"

# -------------------------------------------------------------------
# Environment Variables (non-secret)
# -------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
APP_URL = "https://imagevault.ai"
NEXT_PUBLIC_BASE_URL = "https://imagevault.ai"
RESEND_FROM_EMAIL = "ImageVault <noreply@imagevault.ai>"
CF_ACCOUNT_ID = "2db6ad770fad71b79fa3249b202c6c37"          # Cloudflare account ID (from dash.cloudflare.com → top-right)
R2_BUCKET_NAME = "image-vault-scans"   # override with "image-vault-scans-dev" for preview

# -------------------------------------------------------------------
# Queues (producers — the app Worker can send; consumers are the dedicated workers)
# -------------------------------------------------------------------
[[queues.producers]]
binding = "PIPELINE_QUEUE"
queue = "pipeline-jobs"

[[queues.producers]]
binding = "INBOUND_QUEUE"
queue = "inbound-email"

[[queues.producers]]
binding = "GEO_FINGERPRINT_QUEUE"
queue = "geo-fingerprint-jobs"

[[queues.producers]]
binding = "PITCH_QUEUE"
queue = "pitch-jobs"

[[queues.producers]]
binding = "MONITOR_SWEEP_QUEUE"
queue = "monitor-sweeps"

# -------------------------------------------------------------------
# Queue consumer — the app Worker consumes its own monitor-sweeps queue
# (worker.ts custom entrypoint), so sweeps get the full lib/ graph plus all
# app secrets/bindings without duplicating them into a dedicated worker.
# Create the queue once before deploying: wrangler queues create monitor-sweeps
# -------------------------------------------------------------------
[[queues.consumers]]
queue = "monitor-sweeps"
max_batch_size = 1        # one sweep per invocation — they run 5-15 minutes
max_concurrency = 1       # sweeps serialise globally: shared Apify budget ceiling
max_retries = 3           # redeliveries only fire when the consumer dies outright;
                          # the spend guard in lib/monitor/sweep-queue.ts decides
                          # whether a redelivery re-runs or settles the scan

# -------------------------------------------------------------------
# Vectorize (semantic search)
# -------------------------------------------------------------------
[[vectorize]]
binding = "VECTORIZE"
index_name = "package-search"

# -------------------------------------------------------------------
# Workers AI
# -------------------------------------------------------------------
[ai]
binding = "AI"

[[services]]
binding = "AI_SERVICE"
service = "image-vault-ai"

[[services]]
binding = "AI_CRON_SERVICE"
service = "image-vault-ai-cron"

# -------------------------------------------------------------------
# Secrets (set via: wrangler secret put SECRET_NAME)
# -------------------------------------------------------------------
# ENCRYPTION_MASTER_KEY   - Server-side key wrapping key
# JWT_SECRET              - JWT signing secret
# RESEND_API_KEY          - Email notifications
# TWILIO_ACCOUNT_SID      - SMS 2FA
# TWILIO_AUTH_TOKEN       - SMS 2FA
# TWILIO_FROM_NUMBER      - SMS 2FA
# R2_ACCESS_KEY_ID        - R2 API token access key (for presigned upload URLs)
# R2_SECRET_ACCESS_KEY    - R2 API token secret access key (for presigned upload URLs)
# TMDB_API_KEY            - The Movie Database API key (free at themoviedb.org) for talent onboarding
# MESHY_API_KEY           - Meshy API key for GLB preview generation (pipeline stage 3)
# BRIDGE_SIGNING_KEY_JWK  - P-256 private key JWK for signing Bridge grant manifests
#                           Generate with: node scripts/generate-bridge-key.mjs
# ANTHROPIC_API_KEY       - Anthropic API key for Claude Haiku (AI features: fee guidance, licence summaries)
# RESEND_WEBHOOK_SECRET   - Svix webhook signing secret (from Resend dashboard → Webhooks)
# FINGERPRINT_SIGNING_KEY    - HMAC-SHA256 key for geometric OBJ fingerprinting (shared with geo-fingerprint-worker)
#                              Generate: openssl rand -hex 32
# HIGGSFIELD_API_KEY          - Higgsfield AI video generation API key (https://higgsfield.ai)
# HIGGSFIELD_WEBHOOK_SECRET   - HMAC secret for verifying Higgsfield webhook callbacks (optional)
